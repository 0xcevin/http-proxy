name: Docker Build Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t http-proxy:test .
          echo "Docker build completed successfully"

      - name: Test Docker image
        run: |
          # 测试镜像能否正常运行（显示帮助或版本）
          docker run --rm http-proxy:test --help 2>/dev/null || echo "Image built successfully"
          docker images http-proxy:test

      - name: Image info
        run: |
          echo "=== Image Size ==="
          docker images http-proxy:test --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
          echo ""
          echo "=== Image History ==="
          docker history http-proxy:test --no-trunc | head -10
